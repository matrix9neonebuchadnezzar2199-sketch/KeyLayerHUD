<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeyLayerHUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/cyber.css" />
    <link rel="stylesheet" href="/src/styles/hud.css" />
    <script type="module" src="/src/hud.ts"></script>
  </head>
  <body>
    <div id="hud-root" class="hud-root">
      <div id="hud-panel" class="hud-panel">
        <div class="hud-top" data-tauri-drag-region>
          <h1 class="hud-title">KeyLayer HUD</h1>
          <span id="conn-pill" class="status-pill mock">Mock</span>
          <span id="layer-badge" class="layer-badge">Layer 0</span>
          <span id="pin-ind" class="pin-indicator">📌</span>
          <div class="mode-toggle">
            <button class="hdr-btn active" id="btn-overlay" type="button">Overlay</button>
            <button class="hdr-btn" id="btn-edit" type="button">Edit</button>
          </div>
        </div>
        <div class="edit-bar" id="edit-bar">
          <label>不透明度 <input type="range" id="opacity" min="30" max="100" value="88" /></label>
          <label>スケール <input type="range" id="scale" min="70" max="130" value="100" /></label>
          <button class="hdr-btn" id="btn-pin" type="button">📌 固定</button>
        </div>
        <div class="keyboard-wrap" id="keyboard"></div>
        <div class="layer-tabs" id="layer-tabs"></div>
      </div>
    </div>
  </body>
</html>
